name: Uptime monitor

on:
  schedule:
    # Every 8 hours: 07:00, 15:00 and 23:00 UTC (9:00, 17:00, 1:00 Amsterdam summer time)
    - cron: '0 7,15,23 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Just send a test message to Slack
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check sites
        run: node monitor.mjs ${{ inputs.test && '--test' || '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # GitHub switches off schedules in repos with no activity for 60 days.
      # Re-enabling the workflow on every run keeps it switched on.
      - name: Keep schedule alive
        if: always()
        run: gh workflow enable monitor.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
